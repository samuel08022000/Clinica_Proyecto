# Prioridad mayor que las variables de la base de desarrollo y el archivo .env.
config_ordinal=350
quarkus.datasource.jdbc.url=${CLINICA_TEST_JDBC_URL:}
quarkus.datasource.username=${CLINICA_TEST_DB_USER:}
quarkus.datasource.password=${CLINICA_TEST_DB_PASSWORD:}
quarkus.datasource.devservices.image-name=postgres:15-alpine
quarkus.datasource.devservices.reuse=false
quarkus.compose.devservices.enabled=false
quarkus.scheduler.enabled=false
