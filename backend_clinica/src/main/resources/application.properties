# Conexión exacta a tu contenedor de docker-compose.yml
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=admin_clinica
quarkus.datasource.password=password_seguro_123
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/db_clinica

# CRÍTICO: "none" evita que Hibernate rompa tus triggers y columnas GENERATED ALWAYS AS
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true

# Activar Flyway para que ejecute V1__control_citas_postgresql_completo.sql al iniciar
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# Puerto y CORS para Laravel
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:8000,http://127.0.0.1:8000