quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://127.0.0.1:5433/db_clinica}

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration
%dev.quarkus.flyway.locations=classpath:db/migration,filesystem:db/dev-migration
%dev.quarkus.flyway.placeholders."environment"=development
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:8000,http://127.0.0.1:8000

# Autenticacion: sesiones opacas locales al proceso, sin claves embebidas.
auth.session.ttl.minutes=120
auth.login.max-attempts=5
auth.login.window.minutes=15
auth.login.lock.minutes=15

# Registro y OTP. El proveedor permanece deshabilitado hasta configurarlo explicitamente.
auth.registration.challenge.ttl.minutes=30
otp.delivery.provider=${OTP_DELIVERY_PROVIDER:disabled}
otp.demo.access-key=${OTP_DEMO_ACCESS_KEY:}

# SMTP permanece en mock por defecto. Para Gmail se requiere habilitacion explicita y credenciales externas.
quarkus.mailer.host=${QUARKUS_MAILER_HOST:localhost}
quarkus.mailer.port=${QUARKUS_MAILER_PORT:587}
quarkus.mailer.start-tls=${QUARKUS_MAILER_START_TLS:REQUIRED}
quarkus.mailer.tls=${QUARKUS_MAILER_TLS:false}
quarkus.mailer.mock=${QUARKUS_MAILER_MOCK:true}
quarkus.mailer.login=${QUARKUS_MAILER_LOGIN:REQUIRED}
quarkus.mailer.auth-methods=${QUARKUS_MAILER_AUTH_METHODS:DIGEST-MD5 CRAM-SHA256 CRAM-SHA1 CRAM-MD5 PLAIN LOGIN}
quarkus.mailer.keep-alive-timeout=${QUARKUS_MAILER_TIMEOUT:15S}
