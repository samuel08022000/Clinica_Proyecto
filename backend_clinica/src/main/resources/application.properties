quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://127.0.0.1:5433/db_clinica}

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=false
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.clean-disabled=true
quarkus.flyway.locations=classpath:db/migration
%dev.quarkus.flyway.locations=classpath:db/migration,filesystem:db/dev-migration
%dev.quarkus.flyway.out-of-order=true
%dev.quarkus.flyway.placeholders."environment"=development
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:8000,http://127.0.0.1:8000

# Autenticacion: sesiones opacas locales al proceso, sin claves embebidas.
auth.session.ttl.minutes=120
auth.login.max-attempts=5
auth.login.window.minutes=15
auth.login.lock.minutes=15

# Registro y OTP. El proveedor permanece deshabilitado hasta configurarlo explicitamente.
auth.registration.challenge.ttl.minutes=30
otp.delivery.provider=${OTP_DELIVERY_PROVIDER:disabled}
otp.demo.access-key=${OTP_DEMO_ACCESS_KEY:}

# Google OIDC. Deshabilitado hasta configurar un cliente Web en Google Cloud.
google.oauth.enabled=${GOOGLE_OAUTH_ENABLED:false}
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:http://127.0.0.1:8000/auth/google/callback}
google.oauth.authorization-endpoint=https://accounts.google.com/o/oauth2/v2/auth
google.oauth.continuation.ttl.minutes=10

# Enlaces de recuperacion entregados por el mismo proveedor de correo de OTP.
auth.frontend.base-url=${AUTH_FRONTEND_BASE_URL:http://127.0.0.1:8000}

# SMTP real requiere habilitacion explicita y credenciales externas. Solo test usa mock.
quarkus.mailer.host=${QUARKUS_MAILER_HOST:localhost}
quarkus.mailer.port=${QUARKUS_MAILER_PORT:587}
quarkus.mailer.start-tls=${QUARKUS_MAILER_START_TLS:REQUIRED}
quarkus.mailer.tls=${QUARKUS_MAILER_TLS:false}
quarkus.mailer.mock=${QUARKUS_MAILER_MOCK:false}
%test.quarkus.mailer.mock=true
quarkus.mailer.login=${QUARKUS_MAILER_LOGIN:REQUIRED}
quarkus.mailer.auth-methods=${QUARKUS_MAILER_AUTH_METHODS:DIGEST-MD5 CRAM-SHA256 CRAM-SHA1 CRAM-MD5 PLAIN LOGIN}
quarkus.mailer.username=${QUARKUS_MAILER_USERNAME:}
quarkus.mailer.password=${QUARKUS_MAILER_PASSWORD:}
quarkus.mailer.from=${QUARKUS_MAILER_FROM:}
# El envio debe terminar antes del timeout HTTP de registro en Laravel (30 segundos).
quarkus.mailer.timeout=${QUARKUS_MAILER_TIMEOUT:20S}
quarkus.mailer.keep-alive-timeout=${QUARKUS_MAILER_KEEP_ALIVE_TIMEOUT:15S}
