name: clinica-fase12

# Exclusive ephemeral database; never mount the development pgdata volume here.
services:
  postgres_test:
    image: postgres:15
    restart: "no"
    environment:
      POSTGRES_USER: clinica_test
      POSTGRES_PASSWORD: ${CLINICA_TEST_DB_PASSWORD:?Generate a temporary integration password}
      POSTGRES_DB: clinica_fase12_tests
      TZ: America/La_Paz
    ports:
      - "127.0.0.1:35441:5432"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      clinica.environment: isolated-integration-fase12
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinica_test -d clinica_fase12_tests"]
      interval: 2s
      timeout: 3s
      retries: 30
