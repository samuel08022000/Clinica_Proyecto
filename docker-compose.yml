# Referencia histórica (PostgreSQL 15 habitual + pgAdmin opcional).
# El entorno oficial vigente para Laravel + PostgreSQL 16 es compose.clinical.yml
# (contenedores e instrucciones en README.md y scripts/clinical/).
services:
  # Contenedor de Base de Datos PostgreSQL 15 habitual (conservado para datos previos)
  postgres_db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-db_clinica}
      TZ: America/La_Paz
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Contenedor de pgAdmin 4 opcional (--profile pgadmin)
  pgadmin:
    profiles: ["pgadmin"]
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-}
    ports:
      - "127.0.0.1:${PGADMIN_HOST_PORT:-5050}:80"
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  pgdata:
