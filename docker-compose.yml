services:
  # 1. Contenedor de Base de Datos PostgreSQL 15
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_clinica
    restart: always
    environment:
      POSTGRES_USER: admin_clinica
      POSTGRES_PASSWORD: password_seguro_123
      POSTGRES_DB: db_clinica
      TZ: America/La_Paz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_clinica -d db_clinica"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Contenedor de pgAdmin 4 (Para ver tablas/datos en el navegador sin instalar nada)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_clinica
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@clinica.bo
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres_db:
        condition: service_healthy

  # 3. Contenedor del Backend Quarkus (Opcional: usar con --profile fullstack)
  backend_quarkus:
    profiles: ["fullstack"]
    image: maven:3.9.9-eclipse-temurin-21
    container_name: quarkus_clinica
    working_dir: /app
    volumes:
      - ./backend_clinica:/app
      - maven_repo:/root/.m2
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres_db:5432/db_clinica
      QUARKUS_DATASOURCE_USERNAME: admin_clinica
      QUARKUS_DATASOURCE_PASSWORD: password_seguro_123
      QUARKUS_HTTP_HOST: 0.0.0.0
    ports:
      - "8080:8080"
    command: ./mvnw quarkus:dev -Dquarkus.http.host=0.0.0.0
    depends_on:
      postgres_db:
        condition: service_healthy

  # 4. Contenedor del Frontend Laravel (Opcional: usar con --profile fullstack)
  frontend_laravel:
    profiles: ["fullstack"]
    image: php:8.3-cli
    container_name: laravel_clinica
    working_dir: /var/www/html
    volumes:
      - ./frontend_clinica:/var/www/html
    environment:
      QUARKUS_API_URL: http://backend_quarkus:8080/api/v1
      SESSION_DRIVER: file
    ports:
      - "8000:8000"
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      - backend_quarkus

volumes:
  pgdata:
  maven_repo: