services:
  # 1. Contenedor de Base de Datos PostgreSQL 15
  postgres_db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-db_clinica}
      TZ: America/La_Paz
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Contenedor de pgAdmin 4 (Para ver tablas/datos en el navegador sin instalar nada)
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Define PGADMIN_DEFAULT_EMAIL en .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Define PGADMIN_DEFAULT_PASSWORD en .env}
    ports:
      - "127.0.0.1:${PGADMIN_HOST_PORT:-5050}:80"
    depends_on:
      postgres_db:
        condition: service_healthy

  # 3. Contenedor del Backend Quarkus (Opcional: usar con --profile fullstack)
  backend_quarkus:
    profiles: ["fullstack"]
    image: maven:3.10.0-eclipse-temurin-25
    working_dir: /app
    volumes:
      - ./backend_clinica:/app
      - maven_repo:/root/.m2
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres_db:5432/${POSTGRES_DB:-db_clinica}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      QUARKUS_HTTP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${QUARKUS_HOST_PORT:-8080}:8080"
    command: sh ./mvnw quarkus:dev -Dquarkus.http.host=0.0.0.0
    depends_on:
      postgres_db:
        condition: service_healthy

  # 4. Contenedor del Frontend Laravel (Opcional: usar con --profile fullstack)
  frontend_laravel:
    profiles: ["fullstack"]
    image: php:8.5-cli
    working_dir: /var/www/html
    volumes:
      - ./frontend_clinica:/var/www/html
    environment:
      QUARKUS_API_URL: http://backend_quarkus:8080/api/v1
      SESSION_DRIVER: file
    ports:
      - "127.0.0.1:${LARAVEL_HOST_PORT:-8000}:8000"
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      - backend_quarkus

volumes:
  pgdata:
  maven_repo:
